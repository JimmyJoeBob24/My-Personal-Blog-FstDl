<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMod Loading Screen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Slideshow Container */
        #slideshow-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Slide Style */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 1;
        }

        /* Active Slide (Visible) */
        .slide.active {
            opacity: 1;
            z-index: 2;
            animation: slowZoom 8s ease-in-out forwards;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* --- CENTERED UI WRAPPER --- */
        .center-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
        }

        /* Steam Avatar Image */
        .avatar {
            width: 240px;
            height: 240px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* --- THE SPINNING GMOD BOX --- */
        .gmod-loader {
            width: 28px;
            height: 28px;
            background-color: #ffd1dc; 
            border: 3px solid #ffa3b1;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: gmodSpin 5.5s linear infinite;
            box-shadow: 0 0 12px rgba(0,0,0,0.4);
        }

        .gmod-loader span {
            color: #333;
            font-size: 0.6rem; 
            font-weight: bold;
            font-family: monospace;
        }

        @keyframes gmodSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="center-ui">
        <img class="avatar" src="https://avatars.fastly.steamstatic.com/886b8a5d2e6d793de4d93e2704965e52ed52d944_full.jpg" alt="Avatar">
        <div class="gmod-loader">
            <span>:3</span>
        </div>
    </div>

    <div id="slideshow-container">
    </div>

    <audio id="bg-music"></audio>

    <script>
        const images = [
            'res/loadingscreens/backimg (1).png',
            'res/loadingscreens/backimg (1).jpg',
            'res/loadingscreens/backimg (2).png',
            'res/loadingscreens/backimg (2).jpg',
            'res/loadingscreens/backimg (3).jpg',
            'res/loadingscreens/backimg (4).jpg',
            'res/loadingscreens/backimg (5).jpg',
            'res/loadingscreens/backimg (6).jpg',
            'res/loadingscreens/backimg (7).jpg',
            'res/loadingscreens/backimg (8).jpg',
            'res/loadingscreens/backimg (9).jpg',
            'res/loadingscreens/backimg (10).jpg',
            'res/loadingscreens/backimg (11).jpg',
            'res/loadingscreens/backimg (12).jpg',
            'res/loadingscreens/backimg (13).jpg',
            'res/loadingscreens/backimg (14).jpg',
            'res/loadingscreens/backimg (15).jpg',
            'res/loadingscreens/backimg (16).jpg',
            'res/loadingscreens/backimg (17).jpg',
            'res/loadingscreens/backimg (18).jpg',
            'res/loadingscreens/backimg (19).jpg',
            'res/loadingscreens/backimg (20).jpg',
            'res/loadingscreens/backimg (21).jpg',
            'res/loadingscreens/backimg (22).jpg',
            'res/loadingscreens/backimg (23).jpg',
            'res/loadingscreens/backimg (24).jpg',
            'res/loadingscreens/backimg (25).jpg',
            'res/loadingscreens/backimg (26).jpg',
            'res/loadingscreens/backimg (27).jpg',
            'res/loadingscreens/backimg (28).jpg',
            'res/loadingscreens/backimg (29).jpg',
            'res/loadingscreens/backimg (30).jpg',
            'res/loadingscreens/backimg (31).jpg',
            'res/loadingscreens/backimg (32).jpg',
            'res/loadingscreens/backimg (33).jpg',
            'res/loadingscreens/backimg (34).jpg',
            'res/loadingscreens/backimg (35).jpg',
            'res/loadingscreens/backimg (36).jpg',
            'res/loadingscreens/backimg (37).jpg',
            'res/loadingscreens/backimg (38).jpg',
            'res/loadingscreens/backimg (39).jpg',
            'res/loadingscreens/backimg (40).jpg',
            'res/loadingscreens/backimg (41).jpg',
            'res/loadingscreens/backimg (42).jpg',
            'res/loadingscreens/backimg (43).jpg',
        ];

        const audioTracks = [
            'res/loadingscreens/song1.mp3',
            'res/loadingscreens/song2.ogg'
        ];

        const displayDuration = 6000; 

        let currentSlideIndex = 0;
        const container = document.getElementById('slideshow-container');
        const audioPlayer = document.getElementById('bg-music');

        // Helper function to shuffle an array randomly
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function setupSlideshow() {
            // Shuffle the image sequence before building the slideshow elements
            shuffleArray(images);

            images.forEach((imgUrl) => {
                const slide = document.createElement('div');
                slide.classList.add('slide');
                slide.style.backgroundImage = `url('${imgUrl}')`;
                container.appendChild(slide);
            });
        }

        function playRandomMusic() {
            if (audioTracks.length === 0) return;
            const randomIndex = Math.floor(Math.random() * audioTracks.length);
            audioPlayer.src = audioTracks[randomIndex];
            audioPlayer.play().catch(e => console.log("Audio play error:", e));
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            const previousSlide = document.querySelector('.slide.active');
            
            if (previousSlide) {
                previousSlide.classList.remove('active');
            }

            const currentSlide = slides[currentSlideIndex];
            currentSlide.classList.add('active');

            currentSlideIndex = (currentSlideIndex + 1) % slides.length;

            setTimeout(nextSlide, displayDuration);
        }

        audioPlayer.onended = function() {
            playRandomMusic();
        };

        // Initialize everything instantly on load
        setupSlideshow();
        nextSlide();
        playRandomMusic();
    </script>
</body>
</html>
