<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMod Loading Screen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Slideshow Container */
        #slideshow-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Slide Style */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 1;
        }

        /* Active Slide (Visible) */
        .slide.active {
            opacity: 1;
            z-index: 2;
            animation: slowZoom 8s ease-in-out forwards;
        }

        @keyframes slowZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        /* --- THE SPINNING GMOD BOX --- */
        .gmod-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            margin-top: -40px; 
            margin-left: -40px;
            width: 80px;
            height: 80px;
            background-color: #ffd1dc; 
            border: 4px solid #ffa3b1;
            z-index: 5; 
            display: flex;
            justify-content: center;
            align-items: center;
            animation: gmodSpin 1.5s linear infinite;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .gmod-loader span {
            color: #333;
            font-size: 2.2rem;
            font-weight: bold;
            font-family: monospace;
            animation: gmodSpinCounter 1.5s linear infinite;
        }

        @keyframes gmodSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes gmodSpinCounter {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }
    </style>
</head>
<body>

    <div class="gmod-loader">
        <span>:3</span>
    </div>

    <div id="slideshow-container">
        </div>

    <audio id="bg-music" loop></audio>

    <script>
        const images = [
            'res/loadingscreens/backimg.jpg',
            'res/loadingscreens/backimg2.jpg',
            'res/loadingscreens/backimg3.jpg',
            'res/loadingscreens/backimg4.jpg',
            'res/loadingscreens/backimg5.jpg',
            'res/loadingscreens/backimg6.jpg',
            'res/loadingscreens/backimg7.jpg',
            'res/loadingscreens/backimg8.jpg',
            'res/loadingscreens/backimg9.jpg',
            'res/loadingscreens/backimg10.png', 
            'res/loadingscreens/backimg11.jpg'
        ];

        const audioTracks = [
            'res/loadingscreens/song1.mp3',
            'res/loadingscreens/song2.ogg'
        ];

        const displayDuration = 6000; 

        let currentSlideIndex = 0;
        const container = document.getElementById('slideshow-container');
        const audioPlayer = document.getElementById('bg-music');

        function setupSlideshow() {
            images.forEach((imgUrl) => {
                const slide = document.createElement('div');
                slide.classList.add('slide');
                slide.style.backgroundImage = `url('${imgUrl}')`;
                container.appendChild(slide);
            });
        }

        function playRandomMusic() {
            if (audioTracks.length === 0) return;
            const randomIndex = Math.floor(Math.random() * audioTracks.length);
            audioPlayer.src = audioTracks[randomIndex];
            audioPlayer.play();
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            const previousSlide = document.querySelector('.slide.active');
            
            if (previousSlide) {
                previousSlide.classList.remove('active');
            }

            const currentSlide = slides[currentSlideIndex];
            currentSlide.classList.add('active');

            currentSlideIndex = (currentSlideIndex + 1) % slides.length;

            setTimeout(nextSlide, displayDuration);
        }

        // Initialize everything instantly on load
        setupSlideshow();
        nextSlide();
        playRandomMusic();
    </script>
</body>
</html>
